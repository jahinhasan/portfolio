<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #0a0b0f;
    font-family: -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 84px;
  }
  /* subtle grid backdrop, same as the site */
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 40%, black 30%, transparent 75%);
  }
  .glow {
    position: absolute;
    width: 620px; height: 620px;
    right: -160px; top: -180px;
    background: radial-gradient(circle, rgba(109,74,255,0.28) 0%, transparent 62%);
  }
  .kicker {
    position: relative;
    color: #8f8fa8;
    font-size: 22px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-bottom: 26px;
    font-weight: 600;
  }
  .kicker .mark { color: #8b76ff; margin-right: 14px; }
  h1 {
    position: relative;
    color: #f2f3f8;
    font-size: 84px;
    line-height: 1.04;
    letter-spacing: -0.025em;
    font-weight: 800;
    max-width: 920px;
  }
  h1 .accent { color: #8b76ff; }
  .role {
    position: relative;
    margin-top: 30px;
    color: #a4aab8;
    font-size: 30px;
    font-weight: 500;
  }
  .role .dot { color: #6d4aff; margin: 0 14px; }
  .footer {
    position: absolute;
    bottom: 56px;
    left: 84px;
    display: flex;
    gap: 34px;
    color: #6d7280;
    font-size: 21px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .badge {
    position: absolute;
    top: 60px; right: 84px;
    width: 92px; height: 92px;
    border-radius: 22px;
    background: linear-gradient(135deg, #6d4aff 0%, #4630b8 100%);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 40px; font-weight: 800; letter-spacing: -0.02em;
    box-shadow: 0 18px 44px rgba(109,74,255,0.35);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="badge">JH</div>
  <div class="kicker"><span class="mark">◇</span>PORTFOLIO</div>
  <h1>Md. Jahin Hasan<br /><span class="accent">Software Developer</span></h1>
  <div class="role">Web Development <span class="dot">·</span> Automation</div>
  <div class="footer">
    <span>github.com/jahinhasan</span>
    <span>BAUST, Rangpur</span>
  </div>
</body>
</html>
