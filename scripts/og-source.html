<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Archivo Black";
    src: url("../node_modules/@fontsource/archivo-black/files/archivo-black-latin-400-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "Inter";
    src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-standard-normal.woff2") format("woff2");
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("../node_modules/@fontsource/jetbrains-mono/files/jetbrains-mono-latin-500-normal.woff2") format("woff2");
    font-weight: 500;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #121411;
    position: relative;
    display: flex;
    align-items: center;
    padding: 0 72px;
  }
  /* blueprint dot grid */
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(#3d4238 1.5px, transparent 1.5px);
    background-size: 34px 34px;
  }
  .content { position: relative; width: 100%; }
  .masthead {
    display: flex; align-items: center; gap: 16px;
    border-top: 1px solid #3d4238; border-bottom: 1px solid #3d4238;
    padding: 14px 2px; margin-bottom: 40px;
    font-family: "JetBrains Mono", monospace; font-weight: 500;
    font-size: 16px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #b5b3a6; white-space: nowrap;
  }
  .masthead .name { color: #c8f04d; }
  .masthead .sep { color: #82847a; }
  .masthead .mark {
    background: #c8f04d; color: #16180f; padding: 6px 10px;
    font-family: "Archivo Black", sans-serif; letter-spacing: 0;
    font-size: 15px; margin-right: 8px;
  }
  h1 {
    font-family: "Archivo Black", "Arial Black", sans-serif;
    font-size: 96px; line-height: 0.98; letter-spacing: -0.01em;
    text-transform: uppercase; color: #f1efe7;
  }
  .outline {
    color: transparent;
    -webkit-text-stroke: 2px #c8f04d;
  }
  .marker {
    background: #c8f04d; color: #16180f; padding: 0 14px;
  }
  .sub {
    margin-top: 34px; display: flex; align-items: center; gap: 18px;
    font-family: "Inter", sans-serif; font-size: 24px; color: #b5b3a6;
  }
  .avail {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid #3d4238; background: #191c17;
    padding: 10px 16px;
    font-family: "JetBrains Mono", monospace; font-size: 15px;
    letter-spacing: 0.14em; text-transform: uppercase; color: #f1efe7;
  }
  .dot { width: 9px; height: 9px; background: #c8f04d; display: inline-block; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="masthead">
      <span class="mark">JH</span>
      <span class="name">Jahin Hasan</span>
      <span class="sep">/</span>
      <span>Frontend Developer</span>
      <span class="sep">|</span>
      <span>Web Developer</span>
      <span class="sep">|</span>
      <span>Automation Enthusiast</span>
    </div>
    <h1>
      Building<br />
      <span class="outline">digital</span>
      <span class="marker">experiences.</span>
    </h1>
    <div class="sub">
      <span class="avail"><span class="dot"></span> Available for freelance projects</span>
      <span>github.com/jahinhasan</span>
    </div>
  </div>
</body>
</html>
