<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f7f7fb;
    font-family: -apple-system, "Segoe UI", "Inter", system-ui, sans-serif;
    position: relative;
    display: flex;
    align-items: center;
    padding: 0 84px;
  }
  /* pastel color field */
  .blob { position: absolute; border-radius: 9999px; filter: blur(70px); }
  .b1 { width: 480px; height: 480px; top: -160px; right: 200px;
        background: radial-gradient(circle, rgb(109 74 255 / 0.22), transparent 62%); }
  .b2 { width: 380px; height: 380px; bottom: -140px; left: -80px;
        background: radial-gradient(circle, rgb(8 145 178 / 0.18), transparent 60%); }
  .b3 { width: 320px; height: 320px; top: 120px; left: 420px;
        background: radial-gradient(circle, rgb(219 39 119 / 0.12), transparent 60%); }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgb(16 18 26 / 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgb(16 18 26 / 0.05) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 80% at 40% 45%, black 30%, transparent 78%);
  }
  .content { position: relative; max-width: 760px; }
  .kicker {
    color: #6d4aff;
    font-size: 21px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-bottom: 24px;
    font-weight: 700;
  }
  h1 {
    color: #171a24;
    font-size: 78px;
    line-height: 1.05;
    letter-spacing: -0.025em;
    font-weight: 800;
  }
  .grad {
    background-image: linear-gradient(100deg, #6d4aff 0%, #0891b2 48%, #db2777 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .role { margin-top: 26px; color: #4d5468; font-size: 28px; font-weight: 500; }
  .role .dot { color: #6d4aff; margin: 0 14px; }
  .footer {
    position: absolute; bottom: 52px; left: 84px;
    display: flex; gap: 32px;
    color: #7b8194; font-size: 20px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .portrait { position: absolute; right: 84px; top: 96px; width: 300px; }
  .ring {
    background: conic-gradient(from 210deg, #6d4aff, #0891b2, #db2777, #f59e0b, #6d4aff);
    border-radius: 28px; padding: 4px;
    box-shadow: 0 28px 64px -24px rgb(109 74 255 / 0.5);
  }
  .ring img {
    display: block; width: 100%; height: 356px; object-fit: cover; object-position: top;
    border-radius: 24px;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="content">
    <div class="kicker">◇ PORTFOLIO</div>
    <h1>Md. Jahin Hasan<br /><span class="grad">Software Developer</span></h1>
    <div class="role">Web Development <span class="dot">·</span> Automation</div>
  </div>
  <div class="portrait">
    <div class="ring"><img src="../src/assets/jahin.jpg" alt="" /></div>
  </div>
  <div class="footer">
    <span>github.com/jahinhasan</span>
    <span>BAUST, Rangpur</span>
  </div>
</body>
</html>
